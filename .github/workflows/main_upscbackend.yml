name: Build and deploy Node.js app to Azure Web App - upscbackend
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'
      - name: npm install, build, and test
        run: |
          npm install --omit=dev
          npm run build --if-present
      - name: Zip artifact for deployment
        run: zip -r release.zip . -x ".git/*" ".github/*"
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      - name: Unzip artifact for deployment
        run: unzip -o release.zip -d .
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_15762075E923462886017257DE98CBE0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B41302150FB5402FAD22DB079CF5D5EF }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6853A5D1ABCE4A1DB1D26E7B291E5E44 }}
      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'upscbackend'
          slot-name: 'Production'
          package: .
